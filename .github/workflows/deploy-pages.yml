name: Publicar site no GitHub Pages
on:
  push:
    branches: [main]
    paths: ['index.html','data/**','.github/workflows/deploy-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-publication
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar versão atual
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publicar versão atual
        id: deployment
        uses: actions/deploy-pages@v4
