name: Publicar versão atual no GitHub Pages
on:
  push:
    branches: [main]
    paths: ['index.html','data/**','VERSION.json','.github/workflows/deploy-pages.yml']
  workflow_dispatch:
  workflow_run:
    workflows:
      - Atualizar dados do Radar B3
      - Publicar catálogo de ações imediatamente
      - Correção imediata de carregamento
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-publication-main
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
