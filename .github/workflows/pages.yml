name: Atualizar P/L, DY, CRESC e apostas de 2 anos
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '20 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cvm-daily-pipeline
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baixar CVM e B3
        run: python scripts/run.py
      - name: Atualizar P/L, DY, CRESC e teses
        run: python scripts/enhance.py
      - name: Exigir P/L, DY e CRESC
        run: python scripts/complete_indicators.py
      - name: Calcular apostas usando 2 anos
        run: python scripts/two_year_bets.py
      - name: Trava contra N/D
        run: python -c "import json;d=json.load(open('data/ranking.json'));assert len(d['items'])>=10;assert all(x.get('pe') is not None and x.get('dy') is not None and x.get('growth') is not None for x in d['items']);assert d.get('bets_period')=='2 anos';print('PASS:',len(d['items']),'ações com P/L, DY e CRESC; apostas em 2 anos')"
      - name: Publicar ranking
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ranking.json
          git diff --cached --quiet || git commit -m 'data: P/L e apostas de 2 anos validados'
          git pull --rebase
          git push
