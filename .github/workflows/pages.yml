name: Atualizar catálogo e ranking com brapi + 150 testes
on:
  push:
    branches: [main]
    paths: ['scripts/**','tests/**','.github/workflows/pages.yml','BRAPI_CHECK']
  schedule:
    - cron: '20 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-daily-pipeline-v4
  cancel-in-progress: true
jobs:
  update-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verificar conexão brapi
        run: python scripts/verify_brapi.py
      - name: Criar catálogo de todas as ações
        run: python scripts/build_catalog.py
      - name: Baixar CVM e B3
        run: python scripts/run.py
      - name: Enriquecer indicadores e teses
        run: python scripts/enhance.py
      - name: Exigir completude do ranking
        run: python scripts/complete_indicators.py
      - name: Calcular apostas usando 2 anos
        run: python scripts/two_year_bets.py
      - name: Calcular DY médio 5a e 10a e crescimento 10a
        run: python scripts/ten_year_metrics.py
      - name: Rodar suíte com mais de 150 testes
        run: python tests/validate_release.py
      - name: Rodar suíte histórica de 10 anos
        run: python tests/validate_10y.py
      - name: Publicar somente após todos os testes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ranking.json data/catalog.json data/brapi-status.json
          git diff --cached --quiet || git commit -m 'data: brapi conectada e release validada'
          git pull --rebase
          git push
