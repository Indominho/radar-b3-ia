name: Atualizar dados do Radar B3
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-data-manual
  cancel-in-progress: true
jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validar conexão brapi
        run: python scripts/verify_brapi.py
      - name: Gerar catálogo preservado
        run: python scripts/build_catalog.py
      - name: Processar CVM e B3
        run: python scripts/run.py
      - name: Enriquecer indicadores
        run: python scripts/enhance.py
      - name: Calcular históricos e ranking universal
        run: python scripts/two_year_bets.py && python scripts/ten_year_metrics.py && python scripts/five_year_strategy.py && python scripts/annual_indicator_engine.py
      - name: Atualizar interface
        run: python scripts/apply_five_year_ui.py && python scripts/fix_ui_cards.py
      - name: Auditar e validar
        run: python scripts/audit_universe.py && python scripts/normalize_ui.py && python scripts/validate_annual_indicators.py && python scripts/meta_validate_annual.py
      - name: Publicar dados validados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data index.html VERSION.json
          git diff --cached --quiet || git commit -m 'data: atualização validada do Radar B3'
          git pull --rebase
          git push
