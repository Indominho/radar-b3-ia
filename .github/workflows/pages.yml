name: Atualizar catálogo e rankings com brapi
on:
  push:
    branches: [main]
    paths: ['scripts/**','tests/**','.github/workflows/pages.yml','BRAPI_CHECK']
  schedule:
    - cron: '20 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-daily-pipeline-v5
  cancel-in-progress: true
jobs:
  update-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verificar conexão brapi
        run: python scripts/verify_brapi.py
      - name: Criar catálogo de todas as ações
        run: python scripts/build_catalog.py
      - name: Baixar CVM e B3
        run: python scripts/run.py
      - name: Enriquecer indicadores e teses
        run: python scripts/enhance.py
      - name: Exigir completude do ranking
        run: python scripts/complete_indicators.py
      - name: Calcular apostas usando 2 anos
        run: python scripts/two_year_bets.py
      - name: Calcular históricos de 5 e 10 anos
        run: python scripts/ten_year_metrics.py
      - name: Aplicar DY médio e valorização alta em 5 anos
        run: python scripts/five_year_strategy.py
      - name: Inserir ranking de 5 anos na interface
        run: python scripts/apply_five_year_ui.py
      - name: Validar critério combinado
        run: python -c "import json;d=json.load(open('data/ranking.json'));assert all(x['dy_5y_avg']>=15 and x['price_cagr_5y']>=10 for x in d['five_year_picks']);assert d['five_year_strategy']['dy_5y_min']==15;print('5Y PASS',len(d['five_year_picks']))"
      - name: Rodar suítes gerais
        run: python tests/validate_release.py && python tests/validate_10y.py
      - name: Publicar somente após todos os testes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ranking.json data/catalog.json data/brapi-status.json index.html
          git diff --cached --quiet || git commit -m 'data: estratégia 5 anos validada'
          git pull --rebase
          git push
