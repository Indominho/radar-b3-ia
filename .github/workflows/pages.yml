name: Atualizar dados do Radar B3
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-data-essential
  cancel-in-progress: true
jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Catálogo e cotações essenciais
        run: python scripts/verify_brapi.py && python scripts/build_catalog.py && python scripts/run.py
      - name: Fundamentos atuais
        run: python scripts/enhance.py && python scripts/complete_indicators.py
      - name: Atualizar interface essencial
        run: python scripts/apply_five_year_ui.py && python scripts/fix_ui_cards.py && python scripts/audit_universe.py && python scripts/normalize_ui.py
      - name: Validar essenciais
        run: python tests/validate_release10.py
      - name: Publicar dados essenciais
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data index.html VERSION.json
          git diff --cached --quiet || git commit -m 'data: publicar essenciais sem aguardar históricos'
          git pull --rebase
          git push
