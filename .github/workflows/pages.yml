name: Atualizar catálogo e rankings com brapi
on:
  push:
    branches: [main]
    paths: ['index.html','scripts/**','tests/**','data/source-registry.json','.github/workflows/pages.yml','BRAPI_CHECK','VERSION.json']
  schedule:
    - cron: '20 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-pipeline-v1-0-2
  cancel-in-progress: true
jobs:
  update-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/verify_brapi.py
      - run: python scripts/build_catalog.py
      - run: python scripts/run.py
      - run: python scripts/enhance.py
      - run: python scripts/complete_indicators.py
      - run: python scripts/two_year_bets.py && python scripts/ten_year_metrics.py
      - run: python scripts/five_year_strategy.py
      - run: python scripts/annual_indicator_engine.py
      - run: python scripts/apply_five_year_ui.py && python scripts/fix_ui_cards.py
      - run: python scripts/audit_universe.py && python scripts/normalize_ui.py
      - run: python scripts/validate_annual_indicators.py && python scripts/meta_validate_annual.py
      - run: python tests/validate_release.py && python tests/validate_10y.py && python tests/validate_universe.py && python tests/validate_random50.py
      - name: Publicar após todos os testes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ranking.json data/catalog.json data/brapi-status.json data/universe-audit.json data/source-registry.json index.html VERSION.json
          git diff --cached --quiet || git commit -m 'release: Radar B3 IA v1.0.2 dados universais'
          git pull --rebase
          git push
