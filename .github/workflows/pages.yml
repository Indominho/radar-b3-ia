name: Atualizar e testar ranking completo diariamente
on:
  push:
    branches: [main]
    paths: ['scripts/**','tests/**','.github/workflows/pages.yml']
  schedule:
    - cron: '20 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cvm-daily-pipeline
  cancel-in-progress: true
jobs:
  update-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Baixar CVM e B3
        run: python scripts/run.py
      - name: Enriquecer indicadores e teses
        run: python scripts/enhance.py
      - name: Exigir completude de todos os campos exibidos
        run: python scripts/complete_indicators.py
      - name: Calcular apostas usando 2 anos
        run: python scripts/two_year_bets.py
      - name: Atualizar interface para 2 anos
        run: python scripts/update_ui_2y.py
      - name: Remover campos sem cobertura universal e explicar filtros
        run: python scripts/finalize_ui.py
      - name: Rodar suíte com mais de 50 testes
        run: python tests/validate_release.py
      - name: Publicar somente após todos os testes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ranking.json index.html
          git diff --cached --quiet || git commit -m 'data: release aprovada pela suíte completa'
          git pull --rebase
          git push
