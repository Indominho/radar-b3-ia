name: Atualizar dados públicos CVM e B3
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '20 10 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cvm-daily-pipeline
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baixar CVM e B3, calcular ranking
        run: python scripts/run.py
      - name: Publicar ranking no repositório
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ranking.json
          git diff --cached --quiet || git commit -m 'data: atualização diária CVM e B3'
          git pull --rebase
          git push
