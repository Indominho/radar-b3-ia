name: Atualizar catálogo e rankings com brapi
on:
  push:
    branches: [main]
    paths: ['index.html','scripts/**','tests/**','.github/workflows/pages.yml','BRAPI_CHECK']
  schedule:
    - cron: '20 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-daily-pipeline-v5
  cancel-in-progress: true
jobs:
  update-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verificar conexão brapi
        run: python scripts/verify_brapi.py
      - name: Criar catálogo de todas as ações
        run: python scripts/build_catalog.py
      - name: Baixar CVM e B3
        run: python scripts/run.py
      - name: Enriquecer indicadores e teses
        run: python scripts/enhance.py
      - name: Exigir completude do ranking
        run: python scripts/complete_indicators.py
      - name: Calcular apostas usando 2 anos
        run: python scripts/two_year_bets.py
      - name: Calcular históricos de 5 e 10 anos
        run: python scripts/ten_year_metrics.py
      - name: Ordenar renda e valorização dos últimos 5 anos
        run: python scripts/five_year_strategy.py
      - name: Inserir ranking de 5 anos na interface
        run: python scripts/apply_five_year_ui.py
      - name: Validar ranking sem corte mínimo
        run: python -c "import json;d=json.load(open('data/ranking.json'));a=d.get('five_year_picks',[]);assert d['five_year_strategy']['dy_5y_min'] is None;assert d['five_year_strategy']['price_cagr_5y_min'] is None;assert all(isinstance(x.get('dy_5y_avg'),(int,float)) and isinstance(x.get('price_cagr_5y'),(int,float)) for x in a);assert all((a[i].get('dy_5y_avg'),a[i].get('price_cagr_5y')) >= (a[i+1].get('dy_5y_avg'),a[i+1].get('price_cagr_5y')) for i in range(len(a)-1));print('5Y RANKING PASS',len(a))"
      - name: Rodar suítes gerais
        run: python tests/validate_release.py && python tests/validate_10y.py
      - name: Publicar somente após todos os testes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ranking.json data/catalog.json data/brapi-status.json index.html
          git diff --cached --quiet || git commit -m 'data: ranking 5 anos por DY e valorizacao'
          git pull --rebase
          git push
