name: Publicar catálogo de ações imediatamente
on:
  push:
    branches: [main]
    paths: ['.github/workflows/catalog.yml','scripts/build_catalog.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fast-market-catalog
  cancel-in-progress: true
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/build_catalog.py
      - name: Validar catálogo
        run: python -c "import json;d=json.load(open('data/catalog.json'));assert d['count']>=300;assert len({x['ticker'] for x in d['items']})==d['count'];print('CATALOGO PASS',d['count'])"
      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/catalog.json
          git diff --cached --quiet || git commit -m 'data: catálogo completo de ações'
          git pull --rebase
          git push
